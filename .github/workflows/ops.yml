# Scheduled operations for the live service.
#
# GitHub Actions is the scheduler because the Fly machine sleeps when idle
# (min_machines_running = 0), so an in-process timer would only fire while
# someone happened to be using the site. An external HTTP call both wakes the
# machine and does the work.
#
# A failed job emails the repo owner, which is the alerting mechanism.

name: Ops

on:
  schedule:
    # 03:15 UTC daily, off-peak for both US and AU traffic.
    - cron: "15 3 * * *"
  workflow_dispatch:

jobs:
  # ── Off-host database backup ────────────────────────────────────────────────
  #
  # Needs CRON_SECRET as a repository secret here, and BACKUP_GITHUB_TOKEN plus
  # BACKUP_ENCRYPTION_KEY as Fly secrets. All three are set; without them the
  # request returns 401 and the job fails. See OPERATIONS.md for the setup.
  #
  # BACKUP_GITHUB_TOKEN is a fine-grained token with an expiry date (created
  # October 2026; see github.com/settings/personal-access-tokens). When it
  # expires this job starts failing; create a new one and set it on Fly.
  backup:
    name: Off-host database backup
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backup
        run: |
          curl --fail-with-body --silent --show-error --location \
            --max-time 300 \
            --request POST \
            --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://dnspreviewer.com/api/cron/backup

  # ── Deep health check ───────────────────────────────────────────────────────
  #
  # Runs daily and needs no secrets. Fails, and therefore emails, only when
  # something is genuinely wrong: the database is unreachable, the last
  # backup is over 36 hours old, or the wildcard certificate has under 21 days
  # left. The certificate check matters most, because a failed renewal breaks
  # every preview link while the marketing site keeps returning a healthy 200.
  #
  # Deliberately does not depend on the backup job, so a failed backup never
  # stops the certificate check from running.
  health:
    name: Deep health check
    runs-on: ubuntu-latest
    steps:
      - name: Check database and wildcard certificate
        run: |
          curl --fail-with-body --silent --show-error --location \
            --max-time 60 \
            "https://dnspreviewer.com/api/health?deep=1"
